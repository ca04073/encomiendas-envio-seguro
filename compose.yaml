services:
  pg-primary:
    build:
      context: .
      dockerfile: database/Dockerfile
    image: postgres:17-pgaudit
    container_name: pg-primary
    environment:
      POSTGRES_DB: envio_seguro
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - pg_primary_data:/var/lib/postgresql/data
      - pg_wal_archive:/var/lib/postgresql/wal_archive
      - ./database/initdb:/docker-entrypoint-initdb.d:ro
      - ./database/config/postgresql.conf:/etc/postgresql/postgresql.conf:ro
      - ./database/config/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
    command: ["postgres", "-c", "config_file=/etc/postgresql/postgresql.conf", "-c", "hba_file=/etc/postgresql/pg_hba.conf"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d envio_seguro"]
      interval: 5s
      timeout: 5s
      retries: 5

  pg-standby:
    build:
      context: .
      dockerfile: database/Dockerfile
    image: postgres:17-pgaudit
    container_name: pg-standby
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5433:5432"
    volumes:
      - pg_standby_data:/var/lib/postgresql/data
      - ./database/certs/standby:/var/lib/postgresql/certs:ro
    depends_on:
      pg-primary:
        condition: service_healthy
    restart: unless-stopped
    entrypoint: >
      sh -c "
      if [ ! -s /var/lib/postgresql/data/pgdata/PG_VERSION ]; then
        echo '=== [pg-standby] Clonando nodo primario mediante pg_basebackup ===' &&
        PGPASSWORD=ReplPasswordSeguro123 pg_basebackup -h pg-primary -p 5432 -U replicator -D /var/lib/postgresql/data/pgdata -F p -X stream -R -P &&
        chmod 700 /var/lib/postgresql/data/pgdata
      fi &&
      echo '=== [pg-standby] Iniciando PostgreSQL en modo Hot Standby (Read-Only) ===' &&
      exec docker-entrypoint.sh postgres
      "

  # Exporter de métricas para nodo primario (LXC-01)
  postgres-exporter-primary:
    image: quay.io/prometheuscommunity/postgres-exporter:latest
    container_name: postgres-exporter-primary
    environment:
      DATA_SOURCE_NAME: "postgresql://postgres:${DB_PASSWORD:-postgres}@pg-primary:5432/envio_seguro?sslmode=disable"
    ports:
      - "9187:9187"
    depends_on:
      pg-primary:
        condition: service_healthy
    restart: unless-stopped

  # Exporter de métricas para nodo standby (LXC-02)
  postgres-exporter-standby:
    image: quay.io/prometheuscommunity/postgres-exporter:latest
    container_name: postgres-exporter-standby
    environment:
      DATA_SOURCE_NAME: "postgresql://postgres:${DB_PASSWORD:-postgres}@pg-standby:5432/envio_seguro?sslmode=disable"
    ports:
      - "9188:9187"
    depends_on:
      pg-standby:
        condition: service_started
    restart: unless-stopped

  # Base de datos de series de tiempo (LXC-04)
  victoriametrics:
    image: docker.io/victoriametrics/victoria-metrics:latest
    container_name: victoriametrics
    ports:
      - "8428:8428"
    volumes:
      - ./monitoring/victoriametrics/scrape.yml:/etc/victoriametrics/scrape.yml:ro
      - vm_data:/victoria-metrics-data
    command:
      - "-promscrape.config=/etc/victoriametrics/scrape.yml"
      - "-storageDataPath=/victoria-metrics-data"
      - "-retentionPeriod=1"
    restart: unless-stopped

  # Servidor de tableros de visualización (LXC-04)
  grafana:
    image: docker.io/grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - victoriametrics
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: "encomiendas-envio-seguro:local"
    container_name: "encomiendas-envio-seguro"
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - DATABASE_URL=postgresql://postgres:${DB_PASSWORD:-postgres}@pg-primary:5432/envio_seguro
    depends_on:
      pg-primary:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pg_primary_data:
    driver: local
  pg_wal_archive:
    driver: local
  pg_standby_data:
    driver: local
  vm_data:
    driver: local
  grafana_data:
    driver: local

# =====================================================================
# PostgreSQL 17 - Configuración Principal (LXC-01: pg-primary)
# Proyecto: Sistema de Encomiendas "Envío Seguro" (ADB135)
# =====================================================================

# ---------------------------------------------------------------------
# CONECTIVIDAD Y RED
# ---------------------------------------------------------------------
listen_addresses = '*'
port = 5432
max_connections = 100

# ---------------------------------------------------------------------
# MEMORIA Y RECURSOS
# ---------------------------------------------------------------------
shared_buffers = 128MB
work_mem = 4MB
maintenance_work_mem = 64MB
effective_cache_size = 384MB

# ---------------------------------------------------------------------
# ALTA DISPONIBILIDAD, WAL Y REPLICACIÓN EN STREAMING
# ---------------------------------------------------------------------
wal_level = replica
max_wal_senders = 5
max_replication_slots = 5
wal_keep_size = 256MB
hot_standby = on
archive_mode = on
archive_command = 'test ! -f /var/lib/postgresql/wal_archive/%f && cp %p /var/lib/postgresql/wal_archive/%f'

# ---------------------------------------------------------------------
# OBSERVABILIDAD, EXTENSIONES Y RENDIMIENTO
# ---------------------------------------------------------------------
shared_preload_libraries = 'pg_stat_statements, pgaudit'
pg_stat_statements.max = 10000
pg_stat_statements.track = all

# Configuración de Auditoría Avanzada con pgAudit
pgaudit.log = 'READ, WRITE, DDL, ROLE'
pgaudit.log_catalog = off
pgaudit.log_level = 'log'
pgaudit.log_parameter = on
pgaudit.log_statement_once = off

# ---------------------------------------------------------------------
# AUDITORÍA Y BITÁCORAS DE REGISTRO (LOGGING)
# ---------------------------------------------------------------------
log_destination = 'stderr'
logging_collector = on
log_directory = 'log'
log_filename = 'postgresql-%Y-%m-%d_%H%M%S.log'
log_rotation_age = 1d
log_rotation_size = 100MB
log_min_messages = warning
log_min_error_statement = error
log_min_duration_statement = 500
log_statement = 'ddl'
log_connections = on
log_disconnections = on
log_line_prefix = '%m [%p] %q%u@%d '
log_timezone = 'America/El_Salvador'
timezone = 'America/El_Salvador'
lc_messages = 'en_US.utf8'
lc_monetary = 'en_US.utf8'
lc_numeric = 'en_US.utf8'
lc_time = 'en_US.utf8'
default_text_search_config = 'pg_catalog.spanish'

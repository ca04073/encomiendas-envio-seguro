# =====================================================================
# PostgreSQL 17 - Control de Autenticación de Clientes (pg_hba.conf)
# Proyecto: Sistema de Encomiendas "Envío Seguro" (ADB135)
# =====================================================================
# TYPE  DATABASE        USER            ADDRESS                 METHOD

# Conexiones locales por socket Unix
local   all             all                                     trust

# Conexiones IPv4 e IPv6 locales
host    all             all             127.0.0.1/32            scram-sha-256
host    all             all             ::1/128                 scram-sha-256

# Conexiones desde red interna / Docker / Proxmox VE
host    all             all             0.0.0.0/0               scram-sha-256

# Replicación en streaming y pg_basebackup (usuario replicator)
host    replication     replicator      0.0.0.0/0               scram-sha-256
host    replication     postgres        0.0.0.0/0               scram-sha-256
host    replication     all             all                     scram-sha-256
